services:
  pricing:
    build: .
    image: pricing-entry:latest
    container_name: pricing-entry
    ports:
      - "${PORT:-5000}:5000"
    environment:
      DATABASE: /data/pricing.sqlite3
      SECRET_KEY: "${SECRET_KEY:-change-me-in-production}"
    volumes:
      - pricing-data:/data
    restart: unless-stopped

volumes:
  pricing-data:
